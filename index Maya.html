<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האימונים שלי 💪</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff6ec;--card:#fffdf8;--tx:#3d2b33;--mu:#9a8189;--ac:#e8658c;--ac2:#fde6ec;--bd:#f4dfdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Assistant","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6;letter-spacing:.01em}
main{max-width:760px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 12px}
h1{font-size:23px;margin:0}.h2{font-size:18px;margin:4px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;font-family:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:16px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{white-space:nowrap;padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;font-size:13px;cursor:pointer}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--ac2)}
.body{padding:6px 8px}.body b{display:block}
.tag{font-size:11px;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.btn{padding:9px 14px;border-radius:12px;border:none;background:var(--ac);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn.g{background:var(--ac2);color:#c9446c}.btn.s{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #e8658c14}
.row{display:flex;gap:8px;align-items:center}.row>*{margin-bottom:0}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.item img,.item .th{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none;background:var(--ac2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.item .n{flex:1;min-width:0}
.num{font-size:13px;background:var(--ac2);color:var(--ac);border-radius:8px;padding:2px 8px;white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.col{background:var(--card);border:1px solid var(--bd);border-radius:10px;min-height:130px;padding:4px 3px;cursor:pointer;overflow:hidden}
.col.today{border-color:var(--ac);background:var(--ac2)}
.dh{text-align:center;font-size:12px;color:var(--mu);margin-bottom:4px}.dh b{display:block;font-size:16px;color:var(--tx)}
.ev{background:var(--ac);color:#fff;border-radius:6px;padding:2px 3px;margin-bottom:3px;font-size:10px;line-height:1.2;word-break:break-word}.ev b{display:block}
.sets{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.setb{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.setb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fin{opacity:.55}.fin .nm{text-decoration:line-through}
.pbar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.wt{display:flex;align-items:center;gap:6px;width:100%;font-size:14px}.wt input{width:110px;margin:0;padding:6px}
.nm{cursor:pointer;display:block}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:8}
#ov2 .sheet{z-index:10}
.sh{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.big{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin:10px 0}
.photob{flex:1;padding:18px 8px;border:2px dashed var(--ac);border-radius:14px;background:var(--ac2);color:var(--ac);font:inherit;font-size:16px;cursor:pointer}.hist{background:none;border:none;color:var(--mu);opacity:.6;font:inherit;font-size:14px;cursor:pointer;padding:10px}.prev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px}
#fab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;padding:12px 16px;border:none;border-radius:99px;background:var(--ac);color:#fff;font:inherit;font-size:15px;box-shadow:0 4px 14px #0004;cursor:pointer;max-width:80%}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:12}
#lb img{max-width:95%;max-height:90%;border-radius:12px}
#status{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:#b3261e;color:#fff;border-radius:12px;padding:10px 12px;z-index:9;display:none;font-size:14px}#status button{margin-inline-start:8px;border:none;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:20;display:none;font-size:14px}
</style>
</head>
<body>
<main>
<header><h1>האימונים שלי 💪</h1><button class="btn" id="go">▶ תחילת אימון</button></header>

<div id="view"></div>
</main>
<button id="fab" hidden></button>
<div id="ov"></div><div id="ov2"></div>
<div id="lb"><img alt=""></div>
<div id="status"></div>

<script>
const MUSCLES=["הכל","רגליים","ישבן","גב","חזה","כתפיים","ידיים","בטן","קרדיו"];
const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"],SH=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const a in p){if(a==="on")for(const ev in p.on)e.addEventListener(ev,p.on[ev]);else if(a==="text")e.textContent=p[a];else e.setAttribute(a,p[a])}k.flat(Infinity).forEach(c=>c!=null&&c!==false&&e.append(c));return e};
const L={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let DATA={ex:[],wk:[],sch:[]};try{DATA=Object.assign(DATA,JSON.parse($("#data").textContent))}catch(_){}
let canEdit=false,art=null,tab=L.get("gym:tab",0),filter="הכל",openW=null,editW=null,pick=false,showForm=false,editEx=null;
const exById=id=>DATA.ex.find(e=>e.id===id),wkById=id=>DATA.wk.find(k=>k.id===id);
const today=()=>new Date().toDateString();
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2500)}

/* ---------- save: the page republishes itself with the data embedded ---------- */
function buildHtml(){
  const c=document.documentElement.cloneNode(true);
  ["#view","#ov","#ov2"].forEach(s=>c.querySelector(s).replaceChildren());
  c.querySelector("#lb").removeAttribute("style");c.querySelector("#lb img").removeAttribute("src");
  c.querySelector("#status").removeAttribute("style");c.querySelector("#status").textContent="";c.querySelector("#toast").removeAttribute("style");c.querySelector("#toast").textContent="";
  c.querySelector("#fab").setAttribute("hidden","");c.querySelector("#fab").textContent="";
  c.querySelectorAll(".tabs button").forEach(b=>b.removeAttribute("class"));
  c.querySelector("#data").textContent=JSON.stringify(DATA).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n"+c.outerHTML;
}
function setStatus(msg,retry){
  const t=$("#status");t.replaceChildren();if(!msg){t.style.display="none";return}
  t.append(msg);if(retry)t.append(el("button",{text:"נסה שוב לשמור",on:{click:commit}}));t.style.display="block";
}
async function commit(){
  L.set("gym:backup",DATA);
  if(!art){setStatus("השינויים נשמרו רק בטלפון הזה – אין הרשאת שמירה לאתר. האם אתה מחובר ל-Claude כבעלים של האתר?");return}
  toast("שומר…");
  try{await art.publish(buildHtml());setStatus("")}
  catch(e){setStatus("השמירה לאתר נכשלה ("+((e&&(e.code||e.message))||"שגיאה")+"). השינויים שמורים בטלפון הזה.",true)}
}
function compress(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=u})}

/* ---------- shared ---------- */
function thumb(ex,cls){return ex&&ex.img?el("img",{src:ex.img,alt:ex.name||""}):el("div",{class:cls||"ph",text:"🏋️"})}
function ov(...n){const o=$("#ov");if(!n.length){o.replaceChildren();return}const sh=el("div",{class:"sheet",on:{click:e=>{if(e.target===sh)ov()}}},el("div",{class:"sh"},n));o.replaceChildren(sh)}
function ov2(...n){const o=$("#ov2");if(!n.length){o.replaceChildren();return}const sh=el("div",{class:"sheet",on:{click:e=>{if(e.target===sh)ov2()}}},el("div",{class:"sh"},n));o.replaceChildren(sh)}
const closeBtn=f=>el("button",{class:"btn g s",text:"✕",on:{click:f}});
function itemsList(k){return el("div",{},(k.items||[]).map((it,i)=>{const ex=exById(it.ex);
  return el("div",{class:"item"},thumb(ex,"th"),el("div",{class:"n"},el("b",{text:(i+1)+". "+(ex?ex.name:"(תרגיל נמחק)")}),it.note?el("div",{class:"mu",text:it.note}):null),el("span",{class:"num",text:(it.sets||"-")+" × "+(it.reps||"-")}))}))}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.className=+b.dataset.t===tab?"on":"");
  $("#view").replaceChildren([renderWeek,renderWk,renderEx][tab]());
}

/* ---------- active workout ---------- */
const keyFor=id=>"gym:s:"+id+":"+today();
function active(){const a=L.get("gym:active",null);return a&&a.d===today()&&wkById(a.wid)?a:null}
function prog(id){const k=wkById(id),st=L.get(keyFor(id),{d:{}});const tot=(k.items||[]).reduce((a,it)=>a+(+it.sets||1),0);return Object.values(st.d||{}).filter(Boolean).length+"/"+tot}
function updFab(){const a=active(),f=$("#fab");if(!a){f.hidden=true;return}f.hidden=false;f.textContent="🔥 "+wkById(a.wid).name+" · "+prog(a.wid)}
function pickStart(){
  ov(el("div",{class:"wk"},el("b",{text:"איזה אימון מתחילים?"}),closeBtn(()=>ov())),el("div",{style:"height:8px"}),
    DATA.wk.length?DATA.wk.map(k=>el("button",{class:"setb",style:"display:block;width:100%;text-align:start;margin-bottom:8px",text:k.name+" · "+(k.items||[]).length+" תרגילים",on:{click:()=>startWorkout(k.id)}}))
    :el("div",{class:"mu",text:"עוד אין אימונים – צור אחד בעמוד האימונים."}));
}
function startWorkout(id){L.set("gym:active",{wid:id,d:today()});openSession(id)}
function showExercise(ex,it){
  if(!ex)return;
  ov2(el("div",{class:"wk"},el("b",{text:ex.name}),closeBtn(()=>ov2())),
    ex.img?el("img",{class:"big",src:ex.img,alt:ex.name}):null,
    el("span",{class:"tag",text:ex.muscle||""}),
    it?el("div",{class:"mu",text:"יעד: "+(it.sets||"-")+" סטים × "+(it.reps||"-")+" חזרות"}):null,
    el("p",{text:ex.desc||"אין הסבר לתרגיל הזה עדיין."}),
    it&&it.note?el("div",{class:"mu",text:"הערה: "+it.note}):null);
}
function openSession(id){
  const k=wkById(id);if(!k)return;
  const key=keyFor(id);let st=L.get(key,{d:{},w:{}});st.d=st.d||{};st.w=st.w||{};
  const save=()=>{L.set(key,st);updFab()};
  const items=k.items||[],total=items.reduce((a,it)=>a+(+it.sets||1),0);
  const bar=el("div",{class:"pbar"},el("i")),cnt=el("span",{class:"mu"}),body=el("div");
  const upd=()=>{const d=Object.values(st.d).filter(Boolean).length;cnt.textContent=d+" / "+total+" סטים"+(total&&d>=total?" 🎉 כל הכבוד!":"");bar.firstChild.style.width=(total?Math.min(100,d/total*100):0)+"%"};
  items.forEach((it,i)=>{
    const ex=exById(it.ex),n=+it.sets||1,row=el("div",{class:"sets"}),open=()=>showExercise(ex,it);
    const th=thumb(ex,"th");th.addEventListener("click",open);
    const nm=el("b",{class:"nm",text:(i+1)+". "+(ex?ex.name:"(תרגיל נמחק)")+" ⓘ",on:{click:open}});
    const lw=L.get("gym:lw:"+it.ex,"");
    const wi=el("input",{inputmode:"decimal",placeholder:lw?"קודם: "+lw:"ק״ג",value:st.w[i]||""});
    wi.addEventListener("input",()=>{st.w[i]=wi.value;if(wi.value)L.set("gym:lw:"+it.ex,wi.value);save()});
    const card=el("div",{class:"item",style:"flex-wrap:wrap"},th,el("div",{class:"n"},nm,it.note?el("div",{class:"mu",text:it.note}):null),
      el("div",{class:"wt"},"משקל (ק״ג):",wi),row);
    const mark=()=>card.classList.toggle("fin",Array.from({length:n},(_,j)=>st.d[i+"_"+j]).every(Boolean));

/* ---------- history (saved per device) ---------- */

  if(!done)return;

function showHistory(){

      (r.ex||[]).map(x=>el("div",{class:"mu",text:"• "+x.n+" – "+x.d+"/"+x.t+" סטים"+(x.w?" · "+x.w+" ק״ג":"")}))),
      el("button",{class:"btn g s",text:"✕",on:{click:()=>{if(confirm("למחוק מההיסטוריה?")){const a=L.get("gym:history",[]);a.splice(idx,1);L.set("gym:history",a);showHistory()}}}})));

/* ---------- weekly schedule ---------- */

/* ---------- workouts ---------- */

function exMenu(e){

    el("button",{class:"setb",style:"display:block;width:100%;margin-bottom:8px",text:"👁️ הצגה",on:{click:()=>showExercise(e)}}),

function exForm(ex){

      if(ex)DATA.ex=DATA.ex.map(x=>x.id===ex.id?o:x);else DATA.ex.push(o);
