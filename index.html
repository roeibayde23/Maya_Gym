/* ===== ALFA mode (navy + cream, stronger navy chrome) ===== */
html.alfa{color-scheme:light}
html.alfa{--bg:#f5efe3;--card:#fffdf6;--tx:#0f1f3d;--mu:#6b7a94;--ac:#0f1f3d;--ac2:#e4ebf5;--bd:#d5dce8}
/* full-bleed navy header (logo + gear) */
html.alfa header{background:#0f1f3d;margin:-8px -16px 14px;padding:14px 16px;align-items:center;border-radius:0 0 18px 18px;box-shadow:0 4px 16px #0f1f3d22}
html.alfa .lm{background:none;-webkit-background-clip:unset;background-clip:unset;color:#f5efe3;-webkit-text-fill-color:#f5efe3}
html.alfa .lg{color:#f5efe3;opacity:.92}
html.alfa .ld{color:#f5efe3;display:inline-flex;align-items:center;justify-content:center;margin-top:6px;line-height:1}html.alfa .ld svg{width:15px;height:11px;display:block}
html.alfa .gear{background:transparent;border-color:#f5efe355;color:#f5efe3}
/* navy tab bar, cream active pill */
html.alfa .tabs{background:#0f1f3d;padding:5px;border-radius:14px;gap:4px}
html.alfa .tabs button{color:#c9d4e8;background:none;border:none}
html.alfa .tabs button.on{background:#f5efe3;color:#0f1f3d;box-shadow:none;font-weight:700}
/* hero + primary navy */
html.alfa .panel.hero{background:linear-gradient(135deg,#0f1f3d,#1a2b4c);color:#f5efe3;box-shadow:0 6px 18px #0f1f3d33}
html.alfa .hero .mu{color:#c9d4e8}
html.alfa .hero .num{background:#2563eb;color:#fff}
html.alfa .hero .item{border-color:#ffffff22}
html.alfa .hero .item b{color:#fff}
html.alfa .hero .chev{color:#f5efe3}
html.alfa #go{background:linear-gradient(135deg,#0f1f3d,#1a2b4c);animation-name:pl-alfa}
@keyframes pl-alfa{0%{box-shadow:0 0 0 0 #0f1f3d66}70%{box-shadow:0 0 0 20px #0f1f3d00}100%{box-shadow:0 0 0 0 #0f1f3d00}}
html.alfa .btn{background:#0f1f3d;color:#f5efe3}
html.alfa .btn.g{background:var(--ac2);color:#0f1f3d}
html.alfa .panel{box-shadow:0 2px 10px #0f1f3d14}
html.alfa .panel.act{border-color:var(--ac);background:linear-gradient(135deg,#fffdf6,#e4ebf5)}
html.alfa .wpill{background:#e4ebf5}

  }
  btn.onclick=()=>{if(S.done){S.done=0;save();open=true}else open=!open;build();paint()};
  document.addEventListener("click",e=>{if(open&&!root.contains(e.target)&&e.target.isConnected){open=false;build()}},true);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")tick()});
  if(running())loop();else paint();
  return{
    sync(on){if(on!==vis){vis=on;root.hidden=!on;document.body.classList.toggle("hastmr",on);if(!on){open=false;build()}}},
    reset(){S=Object.assign({},DEF,{dur:L.get("gym:rest",90),m:S.m});open=false;save();build();paint()},
    state:()=>S,isOpen:()=>open};
})();
window.Timer=Timer;

/* ---------- boot ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=+b.dataset.t;L.set("gym:tab2",tab);openW=null;render()});
$("#go").onclick=pickStart;$("#gear").onclick=openSettings;
$("#fab").onclick=()=>{const a=active();if(a)openSession(a.wid)};
$("#lb").onclick=()=>{$("#lb").style.display="none"};
applyAlfaDom();
render();updFab();
/* storage safety on every start: move photos to IndexedDB, merge the history mirror, rescue an unfinished workout */
(async()=>{try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(_){}
  try{await PH.migrate()}catch(_){}
  try{if(await H.boot())render()}catch(_){}
  try{await rescueStale()}catch(_){}
  try{const ft=L.get("gym:finpend",null),r=ft&&H.get(ft);if(r&&!r.ph&&Date.now()-r.t<2*36e5&&!$("#ov").children.length)showFinish(r);else if(ft&&!r)L.del("gym:finpend")}catch(_){}
  window.__bootDone=true})();
(async()=>{
  if(typeof claude==="undefined"){localMode=true;canEdit=true;applyLocal();render();updFab();return}
  try{
    const u=await claude.use("user");art=await claude.use("artifact");
    canEdit=!!(art&&u&&(u.isOwner()||u.canEdit()));
    const b=L.get("gym:backup",null);
    if(canEdit&&b&&JSON.stringify(b)!==JSON.stringify(DATA)){DATA=Object.assign({ex:[],wk:[],sch:[]},b);setStatus("יש שינויים שלא נשמרו באתר",true)}
    if(canEdit)render();
  }catch(_){}
})();
</script>
